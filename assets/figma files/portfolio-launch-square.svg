  <path d="M76 926h928" stroke="#f6f7f2" stroke-opacity=".18"/>
  <text x="77" y="977" fill="#a5b2a7" font-family="DM Sans, Arial, sans-serif" font-size="14" letter-spacing="2">DESIGN-MINDED. DETAIL-DRIVEN. BUILT FOR THE REAL WORLD.</text>
  <text x="1004" y="977" fill="#b9ee68" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">JG  /  01</text>
</svg>
